{% extends "base.html" %}
{% block title %}SKY SQL &ndash; Flug-ID{% endblock %}
{% block content %}
  <h1>Flug nach ID suchen</h1>

  <form class="search-form" method="get" role="search">
    <div class="field">
      <label for="id">Flug-ID</label>
      <input type="number" id="id" name="id" min="1" inputmode="numeric"
             value="{{ query }}" placeholder="z. B. 280" required autofocus>
    </div>
    <button type="submit">Suchen</button>
  </form>

  {% include "_results_table.html" %}
{% endblock %}
