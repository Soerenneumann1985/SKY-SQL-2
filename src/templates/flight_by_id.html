{% extends "base.html" %}
{% block title %}SKY SQL &ndash; Flug-ID{% endblock %}
{% block content %}
  <h1>Flug nach ID suchen</h1>

  <form class="search-form" method="get">
    <label for="id">Flug-ID</label>
    <input type="number" id="id" name="id" min="1" value="{{ flight_id }}" placeholder="z. B. 280" required>
    <button type="submit">Suchen</button>
  </form>

  {% set kind = "flight" %}
  {% set export_params = {"id": flight_id} %}
  {% include "_results_table.html" %}
{% endblock %}
